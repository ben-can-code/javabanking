<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaBank — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M2 10h20v2H2zm1-4h18v2H3zm-1 8h20v6H2v-6zm2 2v2h16v-2H4zm7-14l9 4H3l9-4z"/></svg>
      </div>
      <div>
        <h1>NexaBank</h1>
        <p>Secure Online Banking</p>
      </div>
    </div>

    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your account</p>

    <div class="role-tabs">
      <button class="role-tab active" id="tab-user"  onclick="setTab('user')">Customer</button>
      <button class="role-tab"        id="tab-admin" onclick="setTab('admin')">Admin</button>
    </div>

    <div class="alert alert-danger" id="err">
      <svg viewBox="0 0 20 20" style="width:16px;height:16px;fill:currentColor;flex-shrink:0;"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
      <span id="err-msg"></span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        <span class="spinner" id="spin"></span>
        <span id="login-label">Sign In</span>
      </button>
    </form>

    <div class="divider">or</div>
    <div class="auth-footer">
      New customer? <a href="register.html">Create an account</a>
    </div>

    <div id="hint-user" class="hint-box">
      Register first to create your login, then sign in here.
    </div>
    <div id="hint-admin" class="hint-box" style="display:none;">
      <strong>Admin credentials:</strong><br>
      Username: <code>bankapp</code> &nbsp; Password: <code>changeit</code>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
  redirectIfLoggedIn();

  function setTab(role) {
    document.getElementById('tab-user').classList.toggle('active',  role === 'user');
    document.getElementById('tab-admin').classList.toggle('active', role === 'admin');
    document.getElementById('hint-user').style.display  = role === 'user'  ? 'block' : 'none';
    document.getElementById('hint-admin').style.display = role === 'admin' ? 'block' : 'none';
    document.getElementById('err').classList.remove('show');
    document.getElementById('username').value = role === 'admin' ? 'bankapp'  : '';
    document.getElementById('password').value = role === 'admin' ? 'changeit' : '';
    document.getElementById('username').focus();
  }

  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errBox   = document.getElementById('err');
    const btn      = document.getElementById('login-btn');
    const spin     = document.getElementById('spin');
    const label    = document.getElementById('login-label');

    errBox.classList.remove('show');
    btn.disabled = true; spin.classList.add('show'); label.textContent = 'Signing in...';

    saveAuth(username, password);
    try {
      const res = await apiFetch('/auth/me');
      if (res && res.ok) {
        const info = await res.json();
        sessionStorage.setItem('binfo', JSON.stringify(info));
        window.location.href = 'dashboard.html';
      } else {
        sessionStorage.clear();
        document.getElementById('err-msg').textContent = 'Incorrect username or password.';
        errBox.classList.add('show');
      }
    } catch(err) {
      sessionStorage.clear();
      document.getElementById('err-msg').textContent = 'Cannot reach server. Make sure the app is running.';
      errBox.classList.add('show');
    }

    btn.disabled = false; spin.classList.remove('show'); label.textContent = 'Sign In';
  });
</script>
</body>
</html>
